<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Inventario - Onder</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header class="topbar">
        <div class="brand"><img src="Logo 1.png" alt="Onder logo"><h1>Inventario</h1></div>
        <nav class="top-actions"><a href="index.html" class="btn ghost">Volver</a></nav>
    </header>
    <main class="main">
        <section class="panel">
            <h3>Inventario</h3>
            <p>Productos y stock.</p>
            <table style="width:100%;margin-top:12px;border-collapse:collapse; color: var(--text);">
                <thead style="text-align:left;color:var(--muted)"><tr><th>Producto</th><th>Stock</th><th>Precio Venta</th></tr></thead>
                <tbody id="inventoryTableBody">
                    <!-- Data injected here -->
                </tbody>
            </table>
        </section>
    </main>
    <script>
        const API_URL = 'http://localhost:3000/api';
        async function fetchInventory() {
            try {
                const response = await fetch(`${API_URL}/inventory`);
                const inventory = await response.json();
                const tbody = document.getElementById('inventoryTableBody');
                tbody.innerHTML = '';
                inventory.forEach(item => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${item.name}</td>
                        <td>${item.stock}</td>
                        <td>$${item.sale_price || '0.00'}</td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (error) {
                console.error('Error fetching inventory:', error);
            }
        }
        document.addEventListener('DOMContentLoaded', fetchInventory);
    </script>
</body>
</html>
