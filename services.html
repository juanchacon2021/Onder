<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Servicios - Onder</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header class="topbar">
        <div class="brand"><img src="Logo 1.png" alt="Onder logo"><h1>Servicios</h1></div>
        <nav class="top-actions"><a href="index.html" class="btn ghost">Volver</a></nav>
    </header>
    <main class="main">
        <section class="panel">
            <h3>Servicios Disponibles</h3>
            <ul id="servicesList" style="margin-top:12px;color:var(--text); list-style: none; padding: 0;">
                <!-- Data injected here -->
            </ul>
        </section>
    </main>
    <script>
        const API_URL = 'http://localhost:3000/api';
        async function fetchServices() {
            try {
                const response = await fetch(`${API_URL}/services`);
                const services = await response.json();
                const list = document.getElementById('servicesList');
                list.innerHTML = '';
                services.forEach(service => {
                    const li = document.createElement('li');
                    li.style.padding = '10px 0';
                    li.style.borderBottom = '1px solid rgba(255,255,255,0.05)';
                    li.innerHTML = `<strong>${service.name}</strong> - $${service.price} <br> <small style="color: var(--muted)">${service.description || ''}</small>`;
                    list.appendChild(li);
                });
            } catch (error) {
                console.error('Error fetching services:', error);
            }
        }
        document.addEventListener('DOMContentLoaded', fetchServices);
    </script>
</body>
</html>
