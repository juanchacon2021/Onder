<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Clientes - Onder</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header class="topbar">
        <div class="brand"><img src="Logo 1.png" alt="Onder logo"><h1>Clientes</h1></div>
        <nav class="top-actions"><a href="index.html" class="btn ghost">Volver</a></nav>
    </header>
    <main class="main">
        <section class="panel">
            <h3>Panel de Clientes</h3>
            <p>Registro de visitas y próximos recordatorios.</p>
            <div id="clientsTableContainer" style="margin-top:12px;">
                <table style="width:100%; border-collapse: collapse; color: var(--text);">
                    <thead style="text-align:left; color:var(--muted)">
                        <tr>
                            <th>Nombre</th>
                            <th>Teléfono</th>
                            <th>Última Visita</th>
                            <th>Próxima Visita</th>
                        </tr>
                    </thead>
                    <tbody id="clientsTableBody">
                        <!-- Data will be injected here -->
                    </tbody>
                </table>
            </div>
        </section>
    </main>
    <script>
        const API_URL = 'http://localhost:3000/api';
        async function fetchClients() {
            try {
                const response = await fetch(`${API_URL}/clients`);
                const clients = await response.json();
                const tbody = document.getElementById('clientsTableBody');
                tbody.innerHTML = '';
                clients.forEach(client => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${client.full_name}</td>
                        <td>${client.phone || 'N/A'}</td>
                        <td>${client.last_visit || 'N/A'}</td>
                        <td>${client.next_visit || 'N/A'}</td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (error) {
                console.error('Error fetching clients:', error);
            }
        }
        document.addEventListener('DOMContentLoaded', fetchClients);
    </script>
</body>
</html>
