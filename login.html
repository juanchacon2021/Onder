<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Login - Onder Barbershop</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
    <header class="topbar">
        <div class="brand">
            <img src="Logo 1.png" alt="Onder logo">
            <h1>Onder Barbershop</h1>
        </div>
    </header>

    <main>
        <section class="panel" style="max-width: 400px; margin: 40px auto;">
            <h2>Iniciar sesión</h2>
            <form id="loginForm" style="margin-top: 20px;">
                <div style="margin-bottom: 15px;">
                    <label for="email" style="display: block; margin-bottom: 5px;">Correo</label>
                    <input type="email" id="email" placeholder="tu@correo.com" style="width: 100%; padding: 10px; border-radius: 8px; background: var(--panel-contrast); border: 1px solid rgba(255,255,255,0.05); color: white;">
                </div>

                <div style="margin-bottom: 20px;">
                    <label for="password" style="display: block; margin-bottom: 5px;">Contraseña</label>
                    <input type="password" id="password" placeholder="••••••••" style="width: 100%; padding: 10px; border-radius: 8px; background: var(--panel-contrast); border: 1px solid rgba(255,255,255,0.05); color: white;">
                </div>

                <div id="loginError" style="color: var(--accent-red); margin-bottom: 15px; font-size: 14px; display: none;">Credenciales incorrectas</div>

                <div style="display:flex;gap:10px;align-items:center;justify-content:space-between">
                    <button class="menu-item active" type="submit" style="border: none; cursor: pointer; width: 100%;">Entrar</button>
                </div>
            </form>
        </section>
    </main>

    <footer class="main-footer">Instagram: <a href="https://instagram.com/onderbarbershop">@onderbarbershop</a></footer>

    <script>
        const API_URL = window.location.hostname === 'localhost' ? 'http://localhost:3000/api' : '/api';
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('loginError');

            try {
                const response = await fetch(`${API_URL}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                if (response.ok) {
                    const data = await response.json();
                    localStorage.setItem('onder_token', data.token);
                    localStorage.setItem('onder_user', JSON.stringify(data.user));
                    window.location.href = 'index.html';
                } else {
                    errorDiv.style.display = 'block';
                }
            } catch (error) {
                console.error('Login error:', error);
                errorDiv.innerText = 'Error de conexión';
                errorDiv.style.display = 'block';
            }
        });
    </script>
</body>
</html>
