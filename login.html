<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Login - Onder Barbershop</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="Logo NEGRO.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
    <header class="topbar">
        <div class="brand">
            <img src="Logo 1.png" alt="Onder logo">
            <h1>Onder Barbershop</h1>
        </div>
    </header>

    <main>
        <section class="form-card">
            <h2>Iniciar sesión</h2>
            <form id="loginForm">
                <label for="email">Correo</label>
                <input type="email" id="email" placeholder="tu@correo.com">

                <label for="password">Contraseña</label>
                <input type="password" id="password" placeholder="••••••••">

                <p id="loginError" class="form-error" hidden></p>

                <div style="display:flex;gap:10px;align-items:center;justify-content:space-between">
                    <button class="btn primary" type="submit"><i class="fa-solid fa-right-to-bracket"></i> Entrar</button>
                    <a href="index.html" class="btn ghost">Volver</a>
                </div>
            </form>
        </section>
    </main>

    <footer class="site-footer">Instagram: <a href="https://instagram.com/onderbarbershop">@onderbarbershop</a></footer>
    <script src="scripts.js" defer></script>
</body>
</html>
